<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estado del dispositivo y cuenta regresiva</title>
  <style>
    html,body{height:100%;margin:0;}
    body{font-family:Inter,system-ui,Arial;background:#0f172a;color:#e6eef8;display:flex;align-items:flex-start;justify-content:center;padding:28px;min-height:100vh;}
    .card{background:#0b1220;padding:20px;border-radius:12px;width:520px;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
    h1{margin:0 0 10px;font-size:1.2rem}
    .row{display:flex;gap:8px;align-items:center;margin:8px 0;}
    label{min-width:120px;color:#9aa7c7;font-size:0.9rem;}
    .value{flex:1;background:rgba(255,255,255,0.02);padding:8px 10px;border-radius:8px;}
    .big{font-size:1.4rem;font-weight:700;text-align:center;margin-top:12px;}
    .muted{color:#94a3b8;font-size:0.9rem}
  </style>
</head>
<body>
  <div class="card" id="cardContent">
    <h1>Información del usuario</h1>

    <div class="row"><label>Dispositivo:</label><div id="device" class="value">Detectando...</div></div>
    <div class="row"><label>Sistema:</label><div id="os" class="value">Detectando...</div></div>
    <div class="row"><label>Navegador:</label><div id="browser" class="value">Detectando...</div></div>
    <div class="row"><label>IP pública:</label><div id="ip" class="value">Detectando...</div></div>

    <hr style="border:none;border-top:1px solid rgba(255,255,255,0.03);margin:12px 0">

    <h1>Cuenta regresiva al "blackout"</h1>
    <div class="big" id="countdown">-- s</div>
    <div class="muted" id="targetInfo">Objetivo: --</div>
  </div>

  <button id="stopBlackout" style="position:fixed;top:12px;right:12px;z-index:10000;padding:10px 12px;border-radius:8px;border:none;background:linear-gradient(90deg,#ff6b81,#7c3aed);color:#fff;cursor:pointer;font-weight:700;">STOP</button>

  <script>
    const kittenUrl = 'https://imgs.search.brave.com/OUjNcfurUpw9LWRDqiggNf70st1jLGz_49CSHcR1LsA/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9zdGF0aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wNDgv/NDQ3Lzg2Ny9zbWFs/bC9jdXRlLWtpdHRl/bi1zbGVlcGluZy15/YXduaW5nLWFuZC1s/YXppbmctb24tYS13/aGl0ZS1yYXNmdXIt/Y2FycGV0LWludGVy/bmF0aW9uYWwtY2F0/LWRheS1jb25jZXB0/LXBob3RvLmpwZw';

    async function downloadImage(url, filename = 'gatito.jpg') {
      try {
        const res = await fetch(url, { mode: 'cors' }).catch(() => null);
        if (res && res.ok) {
          const blob = await res.blob();
          const objectUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = objectUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
          return;
        }
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        console.warn('Descarga fallida:', e);
      }
    }

    function showCaptcha() {
      return new Promise((resolve, reject) => {
        const a = Math.floor(Math.random() * 9) + 1;
        const b = Math.floor(Math.random() * 9) + 1;
        const answer = a + b;

        const overlay = document.createElement('div');
        Object.assign(overlay.style, {
          position: 'fixed',
          inset: '0',
          background: 'rgba(0,0,0,0.7)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 9999
        });

        const box = document.createElement('div');
        Object.assign(box.style, {
          background: '#0b1220',
          color: '#e6eef8',
          padding: '18px',
          borderRadius: '10px',
          width: '320px',
          boxShadow: '0 8px 24px rgba(0,0,0,0.6)',
          textAlign: 'center'
        });

        const title = document.createElement('div');
        title.textContent = 'Verificación humana';
        Object.assign(title.style, { fontWeight: '700', marginBottom: '10px' });

        const q = document.createElement('div');
        q.textContent = `Resuelve: ${a} + ${b} = ?`;
        Object.assign(q.style, { marginBottom: '10px' });

        const input = document.createElement('input');
        input.type = 'number';
        Object.assign(input.style, {
          width: '100%',
          padding: '8px',
          borderRadius: '6px',
          marginBottom: '10px',
          border: '1px solid rgba(255,255,255,0.06)',
          background: 'transparent',
          color: 'inherit',
          boxSizing: 'border-box'
        });

        const btnWrap = document.createElement('div');
        Object.assign(btnWrap.style, { display: 'flex', gap: '8px', justifyContent: 'center' });

        const ok = document.createElement('button');
        ok.textContent = 'Verificar';
        Object.assign(ok.style, {
          padding: '8px 12px',
          borderRadius: '6px',
          cursor: 'pointer',
          background: 'linear-gradient(90deg,#ff6b81,#7c3aed)',
          color: '#fff',
          border: 'none',
          fontWeight: '700'
        });

        const cancel = document.createElement('button');
        cancel.textContent = 'Cancelar';
        Object.assign(cancel.style, {
          padding: '8px 12px',
          borderRadius: '6px',
          cursor: 'pointer',
          background: '#333',
          color: '#fff',
          border: 'none'
        });

        btnWrap.appendChild(ok);
        btnWrap.appendChild(cancel);
        box.appendChild(title);
        box.appendChild(q);
        box.appendChild(input);
        box.appendChild(btnWrap);
        overlay.appendChild(box);
        document.body.appendChild(overlay);

        function clean() {
          overlay.remove();
        }

        ok.addEventListener('click', () => {
          if (parseInt(input.value, 10) === answer) {
            clean();
            resolve(true);
          } else {
            alert('Respuesta incorrecta. Intenta de nuevo.');
          }
        });

        cancel.addEventListener('click', () => {
          clean();
          reject(new Error('cancelled'));
        });

        input.focus();
      });
    }

    async function fetchPublicIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        if (!res.ok) throw new Error('network');
        const j = await res.json();
        return j.ip || 'No disponible';
      } catch {
        return 'No disponible';
      }
    }

    function detectPlatform(ua, uaData) {
      if (uaData?.platform) return uaData.platform;
      if (/Windows/i.test(ua)) return 'Windows';
      if (/Mac OS|Macintosh/i.test(ua)) return 'macOS';
      if (/Android/i.test(ua)) return 'Android';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
      if (/Linux/i.test(ua)) return 'Linux';
      return 'Desconocido';
    }

    function detectBrowser(ua, uaData) {
      if (uaData?.brands && Array.isArray(uaData.brands)) {
        const primary = uaData.brands.find(b => !/Not A Brand/i.test(b.brand));
        if (primary) return primary.brand;
      }
      if (/Edg\/|Edge\//i.test(ua)) return 'Microsoft Edge';
      if (/OPR\/|Opera/i.test(ua)) return 'Opera';
      if (/Chrome\/|CriOS\//i.test(ua) && !/Edg|OPR/i.test(ua)) return 'Google Chrome';
      if (/Firefox\/|FxiOS\//i.test(ua)) return 'Mozilla Firefox';
      if (/Safari\//i.test(ua) && !/Chrome|CriOS|Chromium/i.test(ua)) return 'Safari';
      return 'Desconocido';
    }

    function detectDeviceType(ua, uaData) {
      if (typeof uaData?.mobile === 'boolean') {
        if (uaData.mobile) return 'Móvil';
      }
      if (/Mobi|Android.*Mobile|iPhone|Windows Phone|IEMobile|BlackBerry/i.test(ua)) return 'Móvil';
      if (/Tablet|iPad|Nexus 7|Kindle|Silk/i.test(ua)) return 'Tablet';
      try {
        if (window.matchMedia('(pointer: coarse)').matches && screen.width <= 1024) return 'Tablet';
      } catch {}
      return 'Computadora';
    }

    async function updateInfo() {
      const ua = navigator.userAgent || '';
      const uaData = navigator.userAgentData || null;
      document.getElementById('device').textContent = detectDeviceType(ua, uaData);
      document.getElementById('os').textContent = detectPlatform(ua, uaData);
      document.getElementById('browser').textContent = detectBrowser(ua, uaData);
      document.getElementById('ip').textContent = 'Detectando...';
      const ip = await fetchPublicIP();
      document.getElementById('ip').textContent = ip;
    }

    function showBlackImage() {
      document.documentElement.style.height = '100%';
      document.body.style.margin = '0';
      document.body.style.background = 'black';
      document.body.innerHTML = '';

      const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='black'/></svg>";
      const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'Blackout';
      Object.assign(img.style, {
        position: 'fixed',
        inset: '0',
        width: '100vw',
        height: '100vh',
        objectFit: 'cover',
        display: 'block',
        margin: '0'
      });
      document.body.appendChild(img);

      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    }

    let intervalId = null;

    function startCountdown(seconds = 60) {
      clearInterval(intervalId);
      const targetTs = Date.now() + seconds * 1000;

      function tick() {
        const now = Date.now();
        const diff = Math.max(0, Math.ceil((targetTs - now) / 1000));

        if (diff > 0) {
          document.getElementById('countdown').textContent = 'BLACKOUT INMINENTE EN ' + diff + ' s';
        } else {
          document.getElementById('countdown').textContent = '¡BLACKOUT!';
          clearInterval(intervalId);
          showBlackImage();
        }

        document.getElementById('targetInfo').textContent = 'Objetivo: ' + new Date(targetTs).toLocaleString();
      }

      tick();
      intervalId = setInterval(tick, 1000);
    }

    document.getElementById('stopBlackout').addEventListener('click', async () => {
      try {
        await showCaptcha();
      } catch {
        return;
      }

      clearInterval(intervalId);
      const cd = document.getElementById('countdown');
      const ti = document.getElementById('targetInfo');
      if (cd) cd.textContent = 'BLACKOUT DETENIDO';
      if (ti) ti.textContent = '';

      downloadImage(kittenUrl, 'gatito.jpg');
    });

    (async function init() {
      await updateInfo();
      startCountdown(60);
    })();
  </script>
</body>
</html>
